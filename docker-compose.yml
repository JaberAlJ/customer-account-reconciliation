services:
  postgres:
    image: postgres:16-alpine
    container_name: customer-account-postgres
    environment:
      POSTGRES_DB: customer_account
      POSTGRES_USER: customer_account
      POSTGRES_PASSWORD: customer_account
    ports:
      - "5432:5432"
    volumes:
      - customer-account-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_account -d customer_account"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: customer-account-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/customer_account
      SPRING_DATASOURCE_USERNAME: customer_account
      SPRING_DATASOURCE_PASSWORD: customer_account
      SPRING_LIQUIBASE_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  customer-account-postgres-data:
