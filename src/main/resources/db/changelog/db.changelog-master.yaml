databaseChangeLog:
  - changeSet:
      id: starter-placeholder
      author: progressoft
      changes:
        - sql:
            sql: SELECT 1
  - changeSet:
      id: create-import-batches-table
      author: Jaber Al Jabri
      changes:
        - createTable:
            tableName: import_batches
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: import_date
                  type: TIMESTAMP
              - column:
                  name: file_name
                  type: VARCHAR(255)
              - column:
                  name: total_rows
                  type: INT
              - column:
                  name: imported_rows
                  type: INT
              - column:
                  name: duplicate_rows
                  type: INT
              - column:
                  name: invalid_rows
                  type: INT
  - changeSet:
      id: create-account-check-requests-table
      author: Jaber Al Jabri
      changes:
        - createTable:
            tableName: account_check_requests
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: batch_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: request_id
                  type: VARCHAR(255)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: customer_reference
                  type: VARCHAR(255)
              - column:
                  name: identifier1
                  type: VARCHAR(255)
              - column:
                  name: identifier2
                  type: VARCHAR(255)
              - column:
                  name: identifier3
                  type: VARCHAR(255)
              - column:
                  name: submitted_at
                  type: TIMESTAMP
              - column:
                  name: validation_summary
                  type: VARCHAR(1000)
              - column:
                  name: ownership_result
                  type: VARCHAR(50)