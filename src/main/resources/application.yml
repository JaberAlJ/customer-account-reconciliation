spring:
  application:
    name: customer-account-reconciliation
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/customer_account}
    username: ${SPRING_DATASOURCE_USERNAME:customer_account}
    password: ${SPRING_DATASOURCE_PASSWORD:customer_account}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.progressoft: INFO
